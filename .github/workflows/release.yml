name: release

# Fires on every version tag. Stable tags (v0.1.0) publish a normal release;
# tags with a pre-release suffix (v0.1.0-rc.1, v0.1.0-beta.2) are marked as
# GitHub pre-releases and never become the repo's "latest" release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # let GITHUB_TOKEN create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so `git describe` sees the tag

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Test
        run: |
          go vet ./...
          go test ./...

      - name: Build release binaries
        run: make release

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          # Anything with a semver pre-release suffix (contains "-") is an RC.
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}

      # The Homebrew formula pins each archive by sha256, so it can only be
      # written once the release exists — hence a commit back to main rather than
      # a file kept up to date by hand. Stable tags only: an RC must never become
      # what `brew install` hands people.
      #
      # It pushes over SSH with a deploy key because the ruleset on main requires
      # a pull request, and a deploy key is on that ruleset's bypass list.
      # GITHUB_TOKEN cannot be: the Actions app is not addable as a bypass actor
      # on a user-owned repository. See docs/development.md.
      - name: Update Homebrew formula
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          DEPLOY_KEY: ${{ secrets.RELEASE_SSH_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pin GitHub's own published host keys rather than trusting first use.
          curl -fsSL https://api.github.com/meta \
            | python3 -c 'import json,sys; [print("github.com", k) for k in json.load(sys.stdin)["ssh_keys"]]' \
            >> ~/.ssh/known_hosts
          git remote set-url origin git@github.com:${{ github.repository }}.git

          git fetch origin main
          git checkout -B main origin/main   # dist/ is gitignored, so it survives
          make brew-formula VERSION=${{ github.ref_name }}
          # Stage first: on the very first release the formula is untracked, and
          # plain `git diff` does not see untracked files — it would report
          # "nothing changed" and silently skip the commit.
          git add HomebrewFormula
          if git diff --cached --quiet -- HomebrewFormula; then
            echo "formula already current"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "brew: wallfacer ${{ github.ref_name }} [skip ci]"
          git push origin main
